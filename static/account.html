<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account - Product Video Studio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{--paper:#F5F1EA;--card:#FFFDF9;--ink:#221F1B;--ink2:#6B655C;--line:#DED7CA;--sage:#7D8471;--warn:#A44A3F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
  header.top{display:flex;align-items:center;gap:16px;padding:15px 32px;background:var(--card);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header.top .mark{font:600 12px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
  header.top .sp{flex:1}
  .hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);
    border-radius:3px;background:transparent;cursor:pointer;text-decoration:none;
    font:600 11.5px Inter,sans-serif;letter-spacing:.08em;color:var(--ink)}
  .hdr-btn.active{border-color:var(--ink);background:var(--ink);color:#F7F4EE}
  main{max-width:1000px;margin:0 auto;padding:36px 24px 64px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px;margin:0 0 6px}
  p.sub{color:var(--ink2);margin:0 0 30px;font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:38px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 24px}
  .qcard .lbl{font:600 10.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .qcard .val{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;line-height:1.1;margin-top:8px}
  .qcard .val small{font:500 13px Inter,sans-serif;color:var(--ink2)}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:24px;margin:0 0 16px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  th{background:#EFEAE0;font:600 10.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .pts{display:inline-block;padding:2px 9px;border-radius:999px;background:#F4E4DE;color:var(--warn);font:600 12px Inter,sans-serif}
  .vid{display:flex;align-items:center;gap:10px}
  .vid video{width:118px;height:68px;background:#000;border-radius:4px;object-fit:cover}
  .vid a{color:var(--sage);font-weight:600;text-decoration:none;white-space:nowrap;font-size:12.5px}
  .vid a:hover{text-decoration:underline}
  .none{color:var(--ink2);font-style:italic}
  .msg{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:26px;font-size:14px}
  .msg.err{background:#FBECE7;border-color:#E8C4BA;color:var(--warn)}
  .msg a{color:var(--ink);font-weight:600}
  .signin-card{max-width:420px;margin:60px auto;text-align:center}
  .signin-card .btn{display:inline-block;margin-top:10px;padding:12px 26px;border:1px solid var(--ink);
    background:var(--ink);color:#F7F4EE;border-radius:3px;text-decoration:none;
    font:600 13px Inter,sans-serif;letter-spacing:.06em}
  @media(max-width:680px){.cards{grid-template-columns:1fr}.vid{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="top">
  <span class="mark">JP &middot; Product Video Studio</span>
  <span class="sp"></span>
  <a class="hdr-btn" href="/">Back to Studio</a>
  <a class="hdr-btn active" href="/account.html">MY ACCOUNT</a>
  <button type="button" id="soBtn" class="hdr-btn" hidden>SIGN OUT</button>
</header>

<main>
  <h1>My Account</h1>
  <p class="sub">Your credits and video generation history.</p>

  <div id="gate" class="signin-card" hidden>
    <div class="msg">Please <a href="/login.html?next=/account.html">sign in</a> to view your account and video history.</div>
    <a class="btn" href="/login.html?next=/account.html">SIGN IN</a>
  </div>

  <div id="body" hidden>
    <div class="cards">
      <div class="qcard"><div class="lbl">Available Credits</div><div class="val" id="qAvail">&mdash;</div></div>
      <div class="qcard"><div class="lbl">Credits Used</div><div class="val" id="qUsed">&mdash;</div></div>
      <div class="qcard"><div class="lbl">Total Credits</div><div class="val" id="qTotal">&mdash;</div></div>
    </div>

    <h2>Generation History</h2>
    <div id="recMsg" class="msg" hidden></div>
    <table>
      <thead><tr><th>Generated</th><th>Template</th><th>Credits</th><th>Video</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="none">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  var gate = document.getElementById("gate");
  var body = document.getElementById("body");
  var rows = document.getElementById("rows");
  var recMsg = document.getElementById("recMsg");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function fmt(ts) {
    var d = new Date(ts * 1000);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") +
      ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function json(r) { return r.json().catch(function () { return {}; }).then(function (j) { return {ok: r.ok, j: j}; }); }

  document.getElementById("soBtn").addEventListener("click", function () {
    fetch("/api/logout", {method: "POST", credentials: "same-origin"})
      .finally(function () { location.href = "/account.html"; });
  });

  fetch("/api/me", {credentials: "same-origin", headers: {"Accept": "application/json"}})
    .then(json)
    .then(function (res) {
      if (!res.ok || (res.j && res.j.error)) { gate.hidden = false; return null; }
      document.getElementById("soBtn").hidden = false;
      body.hidden = false;
      var q = res.j.quota || {};
      var cap = typeof q.cap === "number" ? q.cap : 0;
      var used = typeof q.used === "number" ? q.used : 0;
      var avail = typeof q.available === "number" ? q.available : Math.max(0, cap - used);
      document.getElementById("qAvail").innerHTML = avail + ' <small>credits</small>';
      document.getElementById("qUsed").textContent = used;
      document.getElementById("qTotal").textContent = cap;
      return fetch("/api/records", {credentials: "same-origin", headers: {"Accept": "application/json"}}).then(json);
    })
    .then(function (res) {
      if (!res) return;
      if (!res.ok || (res.j && res.j.error)) {
        recMsg.textContent = "Your video history could not be loaded right now.";
        recMsg.className = "msg err"; recMsg.hidden = false;
        return;
      }
      var list = res.j.records || [];
      if (!list.length) {
        rows.innerHTML = '<tr><td colspan="4" class="none">No videos yet &mdash; create one in the Studio.</td></tr>';
        return;
      }
      rows.innerHTML = list.map(function (it) {
        var vid = it.video
          ? '<div class="vid"><video controls preload="metadata" src="' + esc(it.video) + '"></video>' +
            '<a href="' + esc(it.video) + '?dl=' + encodeURIComponent((it.template_label || "video") + ".mp4") + '" download>Download</a></div>'
          : '<span class="none">Not available</span>';
        return '<tr>' +
          '<td>' + fmt(it.created_ts) + '</td>' +
          '<td>' + esc(it.template_label || it.template) + '</td>' +
          '<td><span class="pts">-' + esc(it.points) + '</span></td>' +
          '<td>' + vid + '</td>' +
          '</tr>';
      }).join("");
    })
    .catch(function () {
      gate.hidden = false;
    });
})();
</script>
</body>
</html>
